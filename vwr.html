<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KlausurFit – Verwaltungsrecht (Modul 1)</title>

  <!-- iOS & Mobile PWA Meta-Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VWR Modul 1" />
  <meta name="theme-color" content="#f8fafc" id="meta-theme-color" />

  <style>
    /* =========================================================================
       1. DESIGN TOKENS (LIGHT MODE DEFAULT & DARK MODE VIA CSS VARIABLES)
       ========================================================================= */
    :root,
    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --surface-hover: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;

      --text: #0f172a;
      --text-sec: #334155;
      --text-muted: #64748b;

      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --accent-border: #bfdbfe;
      --accent-text: #1d4ed8;

      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --success-text: #065f46;

      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --warn-text: #92400e;

      --danger-bg: #fff1f2;
      --danger-border: #fecdd3;
      --danger-text: #9f1239;

      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 18px 44px rgba(15, 23, 42, 0.18);
      --backdrop: rgba(15, 23, 42, 0.56);
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #111827;
      --surface-alt: #1e293b;
      --surface-hover: #172033;
      --border: #263244;
      --border-strong: #394860;

      --text: #f1f5f9;
      --text-sec: #cbd5e1;
      --text-muted: #94a3b8;

      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --accent-border: rgba(96, 165, 250, 0.35);
      --accent-text: #60a5fa;

      --success-bg: rgba(16, 185, 129, 0.14);
      --success-border: rgba(52, 211, 153, 0.35);
      --success-text: #6ee7b7;

      --warn-bg: rgba(245, 158, 11, 0.14);
      --warn-border: rgba(251, 191, 36, 0.35);
      --warn-text: #fcd34d;

      --danger-bg: rgba(244, 63, 94, 0.15);
      --danger-border: rgba(251, 113, 133, 0.35);
      --danger-text: #fda4af;

      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.32);
      --shadow-sm: 0 6px 18px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 22px 54px rgba(0, 0, 0, 0.72);
      --backdrop: rgba(2, 6, 23, 0.74);
    }

    /* =========================================================================
       2. RESET, TYPOGRAPHY & BASE LAYOUT
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    h1, h2, h3, h4, p, ul {
      margin: 0;
    }

    /* =========================================================================
       3. STICKY HEADER & GLOBAL VWR PROGRESS BAR
       ========================================================================= */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
    }

    .container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
    }

    .header-inner {
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background-color: var(--accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      flex-shrink: 0;
      letter-spacing: -0.02em;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.25;
    }

    /* Strict flex-wrap utility for ALL toolbars, pills, and filter groups */
    .wrap-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .wrap-between {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Global VWR Progress Bar */
    .vwr-bar {
      background-color: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .vwr-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      flex: 1 1 280px;
      min-width: 0;
    }

    .vwr-slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 170px;
      max-width: 300px;
      min-width: 150px;
    }

    input[type="range"].vwr-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--border-strong);
      outline: none;
      cursor: pointer;
    }

    input[type="range"].vwr-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--surface);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    input[type="range"].vwr-range::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--surface);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    /* =========================================================================
       4. MAIN 2-COLUMN RESPONSIVE GRID (330px LEFT, minmax(0,1fr) RIGHT)
       ========================================================================= */
    .main-shell {
      padding-top: 18px;
      padding-bottom: 36px;
    }

    .mobile-guide-toggle-wrap {
      display: none;
      margin-bottom: 14px;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
      width: 100%;
    }

    .left-guide {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-xs);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 132px;
      max-height: calc(100vh - 150px);
    }

    .right-panel {
      min-width: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (max-width: 959px) {
      .workspace-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
      }
      .mobile-guide-toggle-wrap {
        display: block;
      }
      .left-guide {
        position: static;
        max-height: none;
      }
      .left-guide.mobile-hidden {
        display: none;
      }
    }

    /* =========================================================================
       5. BUTTONS, PILLS, BADGES, INPUTS & SURFACES
       ========================================================================= */
    .card-box {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-xs);
      padding: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--text-sec);
      transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease, opacity 0.14s ease;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--surface-alt);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-sm {
      min-height: 32px;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      min-height: 32px;
      padding: 0;
      border-radius: 8px;
    }

    .btn-primary {
      background-color: var(--accent);
      border-color: transparent;
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
      color: #ffffff;
      border-color: transparent;
    }

    .btn-danger {
      background-color: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }
    .btn-danger:hover:not(:disabled) {
      opacity: 0.88;
      background-color: var(--danger-bg);
      color: var(--danger-text);
    }

    .btn-success {
      background-color: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .btn-warn {
      background-color: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-text);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 32px;
      padding: 5px 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--text-sec);
      transition: all 0.14s ease;
    }
    .pill:hover {
      background-color: var(--surface-alt);
      color: var(--text);
    }
    .pill.active {
      background-color: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background-color: var(--surface-alt);
      color: var(--text-sec);
      white-space: nowrap;
    }
    .badge-accent {
      background-color: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }
    .badge-success {
      background-color: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }
    .badge-warn {
      background-color: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-text);
    }
    .badge-danger {
      background-color: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    .input, .select, .textarea {
      width: 100%;
      background-color: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .input::placeholder, .textarea::placeholder {
      color: var(--text-muted);
    }
    .textarea {
      resize: vertical;
      line-height: 1.5;
    }

    /* =========================================================================
       6. LEFT COLUMN: VORLESUNGS-GUIDE ACCORDION
       ========================================================================= */
    .guide-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .guide-list {
      overflow-y: auto;
      flex: 1;
    }

    .guide-item {
      border-bottom: 1px solid var(--border);
    }
    .guide-item:last-child {
      border-bottom: none;
    }

    .guide-trigger {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: background-color 0.14s ease;
    }
    .guide-trigger:hover {
      background-color: var(--surface-hover);
    }
    .guide-trigger.open {
      background-color: var(--surface-alt);
    }

    .guide-body {
      padding: 12px 14px 14px;
      background-color: var(--surface-hover);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bullet-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bullet-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-sec);
      line-height: 1.48;
    }

    .bullet-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent);
      margin-top: 7px;
      flex-shrink: 0;
    }

    .guide-footer {
      padding: 12px 14px;
      background-color: var(--surface-alt);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    /* =========================================================================
       7. RIGHT COLUMN: MAIN 4 TABS NAVIGATION
       ========================================================================= */
    .main-tabs {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      flex: 1 1 140px;
      min-height: 42px;
      padding: 8px 12px;
      border-radius: 11px;
      border: 1px solid transparent;
      background-color: transparent;
      color: var(--text-sec);
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      transition: all 0.14s ease;
      text-align: center;
    }
    .tab-btn:hover {
      background-color: var(--surface-alt);
      color: var(--text);
    }
    .tab-btn.active {
      background-color: var(--accent);
      color: #ffffff;
    }

    .tab-count {
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background-color: var(--surface-alt);
      color: var(--text-muted);
    }
    .tab-btn.active .tab-count {
      background-color: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    /* =========================================================================
       8. TAB 1: 3D FLASHCARD & RATING CONTROLS
       ========================================================================= */
    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background-color: var(--surface-alt);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background-color: var(--accent);
      transition: width 0.25s ease;
    }

    .flip-scene {
      perspective: 1100px;
      width: 100%;
      cursor: pointer;
      user-select: none;
    }

    .flip-card {
      position: relative;
      width: 100%;
      min-height: 270px;
      transform-style: preserve-3d;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .flip-card.flipped {
      transform: rotateY(180deg);
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      overflow-y: auto;
    }

    .flip-face-back {
      transform: rotateY(180deg);
      border: 2px solid var(--accent-border);
    }

    .flip-question {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.38;
      text-align: center;
      color: var(--text);
      margin: auto;
      max-width: 640px;
    }

    .flip-answer {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-sec);
      margin: auto 0;
    }

    .rating-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 520px) {
      .rating-grid {
        grid-template-columns: 1fr;
      }
      .flip-question {
        font-size: 16.5px;
      }
    }

    /* =========================================================================
       9. TAB 2: NORMS, TAB 3: FORMULIERUNGSHILFEN (CLOZE), TAB 4: DRILLS
       ========================================================================= */
    .norm-row {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-xs);
    }
    .norm-row.clickable {
      cursor: pointer;
    }
    .norm-row.clickable:hover {
      border-color: var(--accent-border);
    }

    .norm-left {
      flex: 0 1 215px;
      min-width: 170px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .norm-mid {
      flex: 1 1 260px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .norm-mask {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
      background-color: var(--accent-soft);
      border: 1px dashed var(--accent);
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 600;
    }

    /* Cloze / Lücken-Test */
    .cloze-gap {
      display: inline-block;
      padding: 0 6px;
      margin: 1px 1px;
      border-radius: 6px;
      background-color: var(--accent-soft);
      border: 1px dashed var(--accent);
      color: transparent;
      cursor: pointer;
      user-select: none;
      transition: all 0.14s ease;
    }
    .cloze-gap:hover {
      border-style: solid;
    }
    .cloze-gap.revealed {
      color: var(--accent-text);
      border-style: solid;
      font-weight: 700;
      user-select: auto;
    }

    .phrase-block {
      background-color: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Compact comparison table inside Rücknahme/Widerruf */
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      min-width: 520px;
    }
    .data-table th, .data-table td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .data-table th {
      background-color: var(--surface-alt);
      color: var(--text);
      font-weight: 700;
    }
    .data-table tr:last-child td {
      border-bottom: none;
    }

    /* Drill Option Button */
    .drill-opt {
      width: 100%;
      text-align: left;
      padding: 11px 13px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background-color: var(--surface-alt);
      color: var(--text-sec);
      font-size: 13.5px;
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .drill-opt:hover {
      border-color: var(--accent-border);
    }
    .drill-opt.opt-correct {
      background-color: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
      font-weight: 600;
    }
    .drill-opt.opt-wrong {
      background-color: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }
    .drill-opt.opt-dim {
      opacity: 0.65;
      background-color: var(--surface);
    }
    .opt-letter {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* =========================================================================
       10. MODALS & TOASTS (ZERO alert() / confirm())
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background-color: var(--backdrop);

        mkCard('c04', 2, 'Schema', 'Nenne die 4 Schritte des Gutachtenstils.', '1. **Obersatz** (Hypothese im Konjunktiv II: „könnte/müsste“) → 2. **Definition / Maßstab** → 3. **Subsumtion** (Sachverhalt an Definition messen) → 4. **Ergebnis** (Indikativ).'),
        mkCard('c05', 2, 'Schema', 'Was unterscheidet Tatbestand und Rechtsfolge einer Rechtsnorm?', '**Tatbestand** („Wenn“-Teil): Voraussetzungen, die im Sachverhalt vorliegen müssen. **Rechtsfolge** („Dann“-Teil): Maßnahme, die die Behörde ergreifen muss oder darf.'),
        mkCard('c06', 2, 'Definition', 'Woran erkennst du gebundene Entscheidung vs. Ermessen im Gesetzestext?', '**Gebundene Entscheidung**: „ist zu …“, „muss“, „hat zu …“ (keine Wahl). **Ermessen**: „kann“, „darf“, „ist befugt“ (Spielraum nach § 40 VwVfG).'),
        mkCard('c07', 2, 'Falle', 'Unbestimmter Rechtsbegriff (z. B. „Zuverlässigkeit“): Wo steht er und wie weit prüfen Gerichte ihn?', 'Steht immer auf der **Tatbestandsseite** (KEIN Ermessen!). Seine Auslegung und Anwendung unterliegt **vollständiger gerichtlicher Überprüfung** (kein Beurteilungsspielraum).'),

        // --- VWR 3 (2) ---
        mkCard('c08', 3, 'Definition', 'Wie definiert § 1 Abs. 4 VwVfG den Begriff „Behörde“?', 'Jede Stelle, die **Aufgaben der öffentlichen Verwaltung** wahrnimmt (funktionaler Behördenbegriff – immer beim VA-Merkmal „Behörde“ zitieren!).'),
        mkCard('c09', 3, 'Definition', 'Nenne die 5 wichtigsten Handlungsformen der Verwaltung und ihr Hauptmerkmal.', '**VA** (§ 35 S. 1: einseitige Einzelfallregelung), **Realakt** (tatsächlich, keine Regelung), **ÖR-Vertrag** (§§ 54 ff.: zweiseitig), **RVO & Satzung** (abstrakt-generelle Normen).'),

        // --- VWR 4 (5) ---
        mkCard('c10', 4, 'Definition', 'Was regeln § 9 VwVfG und § 24 VwVfG?', '**§ 9 VwVfG**: Nach außen wirkende Tätigkeit auf Erlass eines VA oder Abschluss eines ÖR-Vertrags. **§ 24 VwVfG (Untersuchungsgrundsatz)**: Behörde ermittelt Sachverhalt von Amts wegen (inkl. günstiger Umstände, Abs. 2).'),
        mkCard('c11', 4, 'Definition', 'Welche Rolle haben § 13 Abs. 1 Nr. 2 VwVfG und § 29 VwVfG in der Klausur?', '**§ 13 Abs. 1 Nr. 2**: Adressat eines VA ist **Beteiligter** (bei § 28 I immer mitzitieren!). **§ 29 VwVfG**: Recht der Beteiligten auf **Akteneinsicht**.'),
        mkCard('c12', 4, 'Falle', 'Anhörung (§ 28 Abs. 1 VwVfG): Reicht es aus, wenn die Behörde Gelegenheit gibt, der Bürger aber schweigt?', '**Ja!** Nach § 28 Abs. 1 VwVfG genügt es, dem Beteiligten **Gelegenheit zur Stellungnahme** zu geben. Äußert er sich nicht, war die Anhörung trotzdem ordnungsgemäß.'),
        mkCard('c13', 4, 'Falle', 'Wann liegt „Gefahr im Verzug“ (§ 28 Abs. 2 Nr. 1 Alt. 1 VwVfG) vor – und woran scheitert sie oft?', 'Nur wenn selbst bei kürzester Anhörungsfrist ein Zeitverlust einträte, durch den die Maßnahme **zu spät käme** (strenger Maßstab!). Wurde die **Postlaufzeit abgewartet**, hätte ein vorheriger **Telefonanruf** gereicht → keine Gefahr im Verzug!'),
        mkCard('c14', 4, 'Falle', 'Wann ist eine sofortige Entscheidung „im öffentlichen Interesse“ (§ 28 Abs. 2 Nr. 1 Alt. 2 VwVfG) zulässig?', 'Restriktiv auszulegen! Nur wenn der Zweck sonst vereitelt würde (z. B. **Überraschungseffekt** bei Sicherstellung) oder überragende **Schutzgüter** (Leib/Leben) eine sofortige Entscheidung ohne Anhörung zwingend erfordern.'),

        // --- VWR 5 (5) ---
        mkCard('c15', 5, 'Schema', 'Nenne alle 6 Tatbestandsmerkmale des Verwaltungsakts (§ 35 S. 1 VwVfG).', '1. **Hoheitliche Maßnahme** • 2. **Behörde (§ 1 IV)** • 3. **Auf dem Gebiet des öffentlichen Rechts** • 4. **Regelung** • 5. **Einzelfall** • 6. **Außenwirkung**.'),
        mkCard('c16', 5, 'Definition', 'Wie definierst du „hoheitliche Maßnahme“ und „Außenwirkung“ in § 35 S. 1 VwVfG?', '**Hoheitliche Maßnahme**: Jedes zweckgerichtete hoheitliche Handeln mit **Erklärungswert**. **Außenwirkung**: Regelung kommt **außerhalb der Verwaltung** (z. B. bei Privatperson) zum Tragen.'),
        mkCard('c17', 5, 'Definition', 'Wie lautet die exakte Klausur-Definition der „Regelung“ (§ 35 S. 1 VwVfG)?', 'Das **einseitige und unmittelbare Herbeiführen einer Rechtsfolge** (Begründung, Änderung, Aufhebung oder verbindliche Feststellung von Rechten/Pflichten).'),
        mkCard('c18', 5, 'Definition', 'Unterschied zwischen Einzelfall (§ 35 S. 1) und Allgemeinverfügung (§ 35 S. 2 VwVfG)?', '**Einzelfall (S. 1)**: Konkret-individuelle Regelung (konkreter Sachverhalt für bestimmte Person). **Allgemeinverfügung (S. 2)**: Konkret-generelle Regelung (bestimmbarer Personenkreis oder Sacheigenschaft, z. B. Verkehrszeichen).'),
        mkCard('c19', 5, 'Definition', 'Wie wird der begünstigende VA (§ 48 Abs. 1 S. 2 VwVfG) vom belastenden VA abgegrenzt?', '**Begünstigend**: Begründet oder bestätigt ein Recht oder einen rechtlich erheblichen Vorteil. **Belastend (nicht begünstigend)**: Greift in Rechte ein (insb. Art. 2 I, Art. 12 I oder Art. 14 GG).'),

        // --- VWR 6 (5) ---
        mkCard('c20', 6, 'Definition', 'Was regeln § 37 Abs. 1 und § 37 Abs. 2 S. 1 VwVfG?', '**§ 37 Abs. 1**: Inhaltliche **Bestimmtheit** (materiell!). **§ 37 Abs. 2 S. 1**: Grundsatz der **Formfreiheit** (schriftlich, elektronisch, mündlich oder konkludent, soweit Spezialgesetz nichts anderes verlangt).'),
        mkCard('c21', 6, 'Falle', 'Begründung (§ 39 Abs. 1 VwVfG): Reicht eine allgemeine Floskel wie „Nach eingehender Prüfung bleibt nur die Aufhebung“?', '**Nein!** Nach § 39 Abs. 1 S. 2 müssen die **wesentlichen tatsächlichen und rechtlichen Gründe** des Einzelfalls (z. B. zur Zuverlässigkeit) mitgeteilt werden. Lapidare Floskeln = Begründungsfehler!'),
        mkCard('c22', 6, 'Falle', 'Wie und bis wann können fehlende Begründung oder Anhörung geheilt werden (§ 45 VwVfG)?', 'Nach **§ 45 Abs. 1 Nr. 2** (Begründung) und **Nr. 3** (Anhörung) heilbar **bis zum Abschluss der letzten Tatsacheninstanz** eines Gerichtsverfahrens (§ 45 Abs. 2) – insbesondere durch ausführlichen **Widerspruchsbescheid**!'),
        mkCard('c23', 6, 'Falle', 'Klausurfalle: Welche Rechtsfolge hat eine fehlende oder fehlerhafte Rechtsbehelfsbelehrung (§ 37 VI VwVfG, § 58 VwGO)?', 'Führt **NICHT zur formellen Rechtswidrigkeit** des VA! Einzige Fehlerfolge: Die Rechtsbehelfsfrist verlängert sich von 1 Monat auf **1 Jahr (§ 58 Abs. 2 VwGO)**.'),
        mkCard('c24', 6, 'Definition', 'Wann wird ein fehlerhafter VA wirksam (§ 43) und wann ist er nichtig (§ 44 VwVfG)?', 'Mit **Bekanntgabe (§ 43 I)** – auch rechtswidrige VA sind wirksam! Unwirksam ist nur ein **nichtiger VA (§ 43 III)**. Prüfreihenfolge **§ 44**: Abs. 2 (Positiv) → Abs. 3 (Negativ) → Abs. 1 (besonders schwer + offensichtlich).'),

        // --- VWR 7 (4) ---
        mkCard('c25', 7, 'Frist', '4-Tages-Fiktion (§ 41 Abs. 2 S. 1 VwVfG ab 2025): Was gilt, wenn der 4. Tag auf einen Sonntag fällt?', 'Nach **BVerwG (Fiktionslehre)** ist § 41 II 1 eine **Fiktion**, keine echte Frist → **§ 31 Abs. 3 VwVfG gilt NICHT** (auch analog nicht)! Bekanntgabe bleibt am Sonntag. *(BFH im Steuerrecht sieht das anders – im VWR BVerwG folgen!)*'),
        mkCard('c26', 7, 'Frist', '4-Tages-Fiktion: Was passiert bei (a) früherem und (b) späterem tatsächlichen Zugang?', '(a) **Früherer Zugang**: **Unbeachtlich** – gesetzliche Fiktion bleibt bei Tag 4! (b) **Späterer Zugang (§ 41 Abs. 2 S. 3)**: Fiktion gilt nicht; der **tatsächliche Zugangstag** zählt (auch wenn Samstag/Sonntag!).'),
        mkCard('c27', 7, 'Frist', 'Wann ist Bekanntgabe bei förmlicher Zustellung per Einschreiben mit Rückschein?', 'Gemäß **§ 41 Abs. 5 VwVfG i.V.m. § 4 Abs. 1 Alt. 2 VwZG** gilt der auf dem Rückschein **quittierte Übergabetag** als dokumentierter Bekanntgabetag (keine 4-Tages-Fiktion!).'),
        mkCard('c28', 7, 'Frist', 'Schema Widerspruchsfrist (§ 70 I 1 VwGO) – und wann greift § 31 Abs. 3 S. 1 VwVfG?', '**Beginn**: Folgetag nach Bekanntgabe 0:00 Uhr (**§§ 79, 31 I VwVfG, § 187 I BGB**). **Ende**: Zahlengleicher Tag im Folgemonat 24:00 Uhr (**§ 188 II BGB**). **§ 31 III 1 / § 193 BGB** (Sa/So/Feiertag → Werktag) gilt **NUR fürs ENDE, nie für den Beginn!**'),

        // --- VWR 8 (2) ---
        mkCard('c29', 8, 'Schema', 'Nenne alle 5 Nebenbestimmungen (§ 36 Abs. 2 Nr. 1–5 VwVfG) mit den Kalle-Kaleu-Beispielen.', 'Nr. 1 **Befristung** („bis 31.10.“) • Nr. 2 **Bedingung** („bei Bauarbeiten erlischt“) • Nr. 3 **Widerrufsvorbehalt** („widerruflich“) • Nr. 4 **Auflage** („Reinigung Gehweg“) • Nr. 5 **Auflagenvorbehalt** („weitere Maßgaben“).'),
        mkCard('c30', 8, 'Definition', 'Wann sind Nebenbestimmungen bei gebundenem VA (§ 36 I) vs. Ermessens-VA (§ 36 II) zulässig?', '**Gebundener VA (§ 36 I)**: Nur wenn durch Rechtsvorschrift zugelassen ODER um die gesetzlichen Voraussetzungen des VA sicherzustellen. **Ermessens-VA (§ 36 II)**: Nach pflichtgemäßem Ermessen.'),

        // --- VWR 9 (3) ---
        mkCard('c31', 9, 'Schema', 'Wie lautet der 3-stufige Rechtmäßigkeitsaufbau für Eingriffs-Verwaltungsakte?', '**I. Ermächtigungsgrundlage** (Art. 20 III GG + Norm) → **II. Formelle Rechtmäßigkeit** (6 Punkte) → **III. Materielle Rechtmäßigkeit** (1. Tatbestand, 2. Rechtsfolge).'),
        mkCard('c32', 9, 'Schema', 'Nenne alle 6 Prüfungspunkte der formellen Rechtmäßigkeit (Punktegarant!).', '1. **Zuständigkeit** • 2. **Verfahren (§ 28)** • 3. **Form (§ 37 II)** • 4. **Begründung (§ 39 I)** • 5. **Bekanntgabe (§ 41)** • 6. **Rechtsbehelfsbelehrung (§ 37 VI, § 58 VwGO)**.'),
        mkCard('c33', 9, 'Falle', 'Im Spezialgesetz steht „die zuständige Behörde kann …“. Wo prüfst du „zuständige Behörde“?', 'Ausschließlich in der **formellen Rechtmäßigkeit (Punkt 1: Zuständigkeit)** – **nicht** als materielles Tatbestandsmerkmal der Norm!'),

        // --- VWR 10 (3) ---
        mkCard('c34', 10, 'Definition', 'Unterschied zwischen Entschließungs- und Auswahlermessen?', '**Entschließungsermessen**: „Ob“ die Behörde überhaupt einschreitet. **Auswahlermessen**: „Wie“ (welches Mittel / welcher Umfang) und „Gegenüber wem“ (Adressat) gehandelt wird.'),
        mkCard('c35', 10, 'Schema', 'Nenne alle 3 Ermessensfehler nach § 40 VwVfG.', '1. **Ermessensunterschreitung/-nichtgebrauch** (Spielraum verkannt) • 2. **Ermessensfehlgebrauch** (sachfremde/zweckwidrige Motive) • 3. **Ermessensüberschreitung** (gesetzlich unzulässige oder unverhältnismäßige Rechtsfolge).'),
        mkCard('c36', 10, 'Schema', 'Nenne alle 4 Prüfungsstufen der Verhältnismäßigkeit (Ermessensgrenze).', '1. **Legitimer Zweck** • 2. **Geeignetheit** (Zweck zumindest gefördert) • 3. **Erforderlichkeit** (kein milderes, gleich effektives Mittel) • 4. **Angemessenheit** (Nachteil nicht erkennbar außer Verhältnis zum Ziel).'),

        // --- VWR 11 (5) ---
        mkCard('c37', 11, 'Schema', 'Wie lautet der Anspruchsaufbau (und was bedeutet „Umkehrschluss“ bei der AGL)?', '**I. Anspruchsgrundlage (AGL)** (oft im **Umkehrschluss**: „Erlaubnis ist zu erteilen, wenn kein Versagungsgrund vorliegt“) → **II. Formell** (Antrag + zust. Behörde) → **III. Materiell** (TB + RF).'),
        mkCard('c38', 11, 'Definition', 'Wie lautet die 5-teilige Standarddefinition von „Gewerbe“?', 'Jede (1) **erlaubte**, (2) **auf Gewinnerzielung gerichtete**, (3) **auf Dauer angelegte**, (4) **selbstständige** Tätigkeit, die (5) **kein freier Beruf** (§ 18 EStG) ist.'),
        mkCard('c39', 11, 'Definition', 'Wie lautet die Standarddefinition der gewerberechtlichen „Unzuverlässigkeit“?', 'Person bietet aufgrund von **Tatsachen** (mit **Gewerbebezug**) nach dem Gesamteindruck **nicht die Gewähr**, das Gewerbe künftig **ordnungsgemäß auszuüben** (negative Zukunftsprognose – **kein Schuldvorwurf**!).'),
        mkCard('c40', 11, 'Falle', 'Müssen für „Tatsachen“ bei der Gewerbeuntersagung strafgerichtliche Urteile abgewartet werden?', '**Nein!** Strafverfahren können Jahre dauern – für eine effektive **Gefahrenabwehr** genügt es, dass die Verstöße als dem Beweis zugängliche Erkenntnisse feststehen.'),
        mkCard('c41', 11, 'Falle', 'Unzuverlässigkeit: Was genügt NICHT – und zählt der Einfluss einer vorbestraften Geschäftsführerin?', '**Kein Grund**: Private Erbschaftssteuer, punktuelle private Ebay-Streitigkeiten oder 12 J. alte Trunkenheitsfahrt (kein Gewerbebezug!), 20 J. alte Jugendbagatelle (keine Prognose). **Zählt aber**: Maßgeblicher Einfluss unzuverlässiger Dritter (Aufsichtspflicht, *Kalle Kaleu*)!'),

        // --- VWR 12 (8) ---
        mkCard('c42', 12, 'Aufhebung', 'Was prüfst du bei jeder Aufhebung eines Verwaltungsakts als ALLERERSTES?', '**Vorprüfung Spezialgesetz (lex specialis)**: Greift eine fachgesetzliche Aufhebungsnorm (z. B. **§ 4 Abs. 1/2 ApoG**)? Erst wenn **nein**, sind §§ 48, 49 VwVfG anwendbar!'),
        mkCard('c43', 12, 'Aufhebung', 'Was besagt die Kehrseitentheorie (actus contrarius) bei Aufhebungsbescheiden?', '1. Die **Ausgangsbehörde** ist auch für die Aufhebung zuständig. 2. Es gelten dieselben **Formvorschriften** wie für den Ausgangs-VA. 3. Die Aufhebung eines VA ist selbst wieder ein **VA**.'),
        mkCard('c44', 12, 'Aufhebung', 'Besonderheiten bei § 48 Abs. 1 S. 1 VwVfG (Rücknahme eines belastenden rw VA)?', 'EGL über **Wesentlichkeitstheorie** (Art. 20 III GG); **keine Anhörung (§ 28)** & **keine RBB (§ 37 VI)** nötig (begünstigt Bürger); **KEINE Jahresfrist**; Ermessen (ex tunc oder ex nunc, ganz oder teilweise).'),
        mkCard('c45', 12, 'Aufhebung', 'Prüfungsreihenfolge & Rechtsfolge bei § 48 Abs. 1 S. 2, Abs. 2 VwVfG (Geldleistungs-VA)?', 'Vertrauensschutz: **IMMER zuerst S. 3 Nr. 1–3** (Ausschlussgründe) prüfen! Nur wenn keiner greift → S. 2 (Verbrauch) & S. 1 (Abwägung). **Rechtsfolge bei S. 3**: Gem. **§ 48 Abs. 2 S. 4** i.d.R. Rücknahme **ex tunc** (im Regelfall gebunden!).'),
        mkCard('c46', 12, 'Aufhebung', 'Wann liegt grob fahrlässige Unkenntnis nach § 48 Abs. 2 S. 3 Nr. 3 VwVfG vor (Fall Beihilfe)?', 'Wenn der Begünstigte **hinreichend rechtskundig** ist, um ohne Weiteres zu erkennen, dass der VA rechtswidrig ist/sein kann (z. B. **Doppelzahlung ohne zweiten Antrag** bei vorhandenem Problembewusstsein).'),
        mkCard('c47', 12, 'Aufhebung', 'Jahresfrist (§ 48 Abs. 4 VwVfG): Wann beginnt sie (Streitstand) und wann gilt sie NICHT?', '**h.M.**: Volle Kenntnis des **zuständigen Sachbearbeiters** von ALLEN Tatsachen (inkl. Anhörung!). *a.A.*: Kenntnis der Behörde (§ 1 IV). **Gilt NICHT** bei belastenden VA (§ 48 I 1, § 49 I) und bei Arglist/Drohung/Bestechung (**§ 48 IV 2**).'),
        mkCard('c48', 12, 'Aufhebung', 'Besonderheit bei § 48 Abs. 3 VwVfG (Rücknahme sonstiger begünstigender rw VA)?', 'Im Tatbestand sind **KEINE Vertrauensschutzüberlegungen** anzustellen (nur für den Vermögensausgleich relevant)! **Jahresfrist (§ 48 IV)** gilt; Rechtsfolge = **Ermessen** (ex tunc oder ex nunc).'),
        mkCard('c49', 12, 'Aufhebung', 'Widerruf (§ 49 VwVfG – rm VA): Unterschiede zwischen Abs. 1, Abs. 2 und Abs. 3?', '**Abs. 1** (belastend): Ausschlussgründe, keine Frist, **nur ex nunc**. **Abs. 2** (begünstigend, Nr. 1–5; Nr. 5 = überragende Gemeinwohlinteressen): Jahresfrist, **nur ex nunc**. **Abs. 3** (Zweckverfehlung Geldleistung): **lex specialis zu Abs. 2**, Jahresfrist, **ex tunc UND ex nunc** möglich!'),

        // --- VWR 13 (1) ---
        mkCard('c50', 13, 'Schema', 'Ablauf des Widerspruchsverfahrens (§§ 68, 70, 72, 73 VwGO) & Bezug zu § 45 VwVfG?', 'Widerspruch binnen 1 Monat (§ 70; 1 Jahr bei falscher RBB § 58 II) → **Abhilfeprüfung (§ 72)** Ausgangsbehörde → bei Nichtabhilfe **Widerspruchsbescheid (§ 73)** (dort **Heilung** nach § 45 I Nr. 2/3 möglich!).'),

        // --- VWR 14 (1) ---
        mkCard('c51', 14, 'Definition', 'Nenne die 3 Zwangsmittel der Vollstreckung sowie den Unterschied gestrecktes Verfahren vs. Sofortvollzug.', '**3 Zwangsmittel**: Ersatzvornahme, Zwangsgeld, unmittelbarer Zwang. **Gestrecktes Verfahren**: Setzt wirksamen Grund-VA voraus. **Sofortvollzug**: Ohne vorherigen Grund-VA bei gegenwärtiger Gefahr.'),

        // --- VWR 15 (1) ---
        mkCard('c52', 15, 'Schema', 'Bestehens-Regel Modul 1: Wie viele Bewertungspunkte brauchst du für 4,0 – und wo liegen die sichersten Punkte?', '**50 / 100 BP = 4,0** (§ 40 GntZollDVDV). **EGL + Formelle Rechtmäßigkeit** bringen oft bis zu **48/100 BP**! Zusammen mit Fristberechnung & Standarddefinitionen ist das Bestehen gesichert.')
      ];

      // =======================================================================
      // 2. STATE MANAGEMENT & 100 % LOCALSTORAGE PERSISTENCE
      // =======================================================================

      function deepClone(obj) {
        return JSON.parse(JSON.stringify(obj));
      }

      const defaultPersisted = () => ({
        maxVwr: 7,
        theme: 'light',
        notes: {},        // { [lectureId]: string }
        cards: deepClone(DEFAULT_CARDS),
        norms: deepClone(DEFAULT_NORMS),
        drillAnswers: {}  // { [drillId]: { selected, correct } }
      });

      function loadPersisted() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultPersisted();
          const parsed = JSON.parse(raw);
          const base = defaultPersisted();
          return {
            maxVwr: (typeof parsed.maxVwr === 'number' && parsed.maxVwr >= 1 && parsed.maxVwr <= 15) ? parsed.maxVwr : 7,
            theme: (parsed.theme === 'dark' || parsed.theme === 'light') ? parsed.theme : 'light',
            notes: (parsed.notes && typeof parsed.notes === 'object') ? parsed.notes : {},
            cards: (Array.isArray(parsed.cards) && parsed.cards.length > 0) ? parsed.cards : base.cards,
            norms: (Array.isArray(parsed.norms) && parsed.norms.length > 0) ? parsed.norms : base.norms,
            drillAnswers: (parsed.drillAnswers && typeof parsed.drillAnswers === 'object') ? parsed.drillAnswers : {}
          };
        } catch (err) {
          return defaultPersisted();
        }
      }

      const saved = loadPersisted();

      const state = {
        // Persisted
        maxVwr: saved.maxVwr,
        theme: saved.theme,
        notes: saved.notes,
        cards: saved.cards,
        norms: saved.norms,
        drillAnswers: saved.drillAnswers,

        // Static reference sets
        lectures: DEFAULT_LECTURES,
        phrases: DEFAULT_PHRASES,
        drills: DEFAULT_DRILLS,

        // Ephemeral UI State
        activeTab: 'cards',         // 'cards' | 'norms' | 'phrases' | 'drills'
        mobileGuideOpen: false,

        // Left Guide UI
        guideCoreOnly: false,
        expandedLecId: 'vwr-7',

        // Tab 1: Cards UI
        cardMode: 'learn',          // 'learn' | 'list'
        cardStatusFilter: 'ALL',    // 'ALL' | 'OPEN' | 'unsure' | 'known'
        cardVwrFilter: 'ALL',       // 'ALL' | number (1..15)
        cardSearch: '',
        cardIdx: 0,
        cardFlipped: false,

        // Tab 2: Norms UI
        normQuizMode: 'show',       // 'show' | 'hideMeaning' | 'hideNorm'
        normCatFilter: 'ALL',

        phraseGapsRevealed: {},

        // Tab 4: Drills UI
        drillFilter: 'ALL'          // 'ALL' | 'UNSOLVED' | 'WRONG'
      };

      function saveState() {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
            maxVwr: state.maxVwr,
            theme: state.theme,
            notes: state.notes,
            cards: state.cards,
            norms: state.norms,
            drillAnswers: state.drillAnswers
          }));
        } catch (err) {
          // Storage disabled / quota exceeded – silently continue in-memory
        }
      }

      // =======================================================================
      // 3. UTILITIES (ESCAPE, BOLD, THEME, CLIPBOARD, TOAST, MODAL)
      // =======================================================================

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function fmt(str) {
        return esc(str).replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--text);font-weight:700;">$1</strong>');
      }

      function applyTheme() {
        document.documentElement.setAttribute('data-theme', state.theme);
        const btn = document.getElementById('btn-theme');
        if (btn) btn.textContent = state.theme === 'dark' ? 'Light Mode' : 'Dark Mode';
        const meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', state.theme === 'dark' ? '#0b1120' : '#f8fafc');
      }

      function showToast(message, kind) {
        const stack = document.getElementById('toast-stack');
        const el = document.createElement('div');
        el.className = 'toast' + (kind ? ' ' + kind : '');
        el.textContent = message;
        stack.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(4px)';
          setTimeout(() => el.remove(), 220);
        }, 2300);
      }

      function copyCleanText(raw) {
        const clean = String(raw || '').replace(/\{\{(.+?)\}\}/g, '$1');
        try {
          const ta = document.createElement('textarea');
          ta.value = clean;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          ta.remove();
          if (ok) {
            showToast('Textbaustein kopiert!');
          } else {
            showToast('Kopieren nicht möglich.', 'warn');
          }
        } catch (err) {
          showToast('Kopieren fehlgeschlagen.', 'danger');
        }
      }

      function openModal(html) {
        const bd = document.getElementById('modal-backdrop');
        document.getElementById('modal-box').innerHTML = html;
        bd.classList.add('open');
      }

      function closeModal() {
        document.getElementById('modal-backdrop').classList.remove('open');
      }

      function openConfirm(title, text, okLabel, isDanger, onConfirm) {
        openModal(`
          <div class="modal-head">
            <h3 style="font-size:16px;font-weight:700;">${esc(title)}</h3>
            <button type="button" class="btn btn-icon" id="m-x">✕</button>
          </div>
          <p class="text-sm text-sec">${esc(text)}</p>
          <div class="wrap-bar" style="justify-content:flex-end;">
            <button type="button" class="btn" id="m-cancel">Abbrechen</button>
            <button type="button" class="btn ${isDanger ? 'btn-danger' : 'btn-primary'}" id="m-ok">${esc(okLabel)}</button>
          </div>
        `);
        document.getElementById('m-x').onclick = closeModal;
        document.getElementById('m-cancel').onclick = closeModal;
        document.getElementById('m-ok').onclick = () => {
          closeModal();
          onConfirm();
        };
      }

      // =======================================================================
      // 4. GLOBAL VWR SCOPE SELECTORS
      // =======================================================================

      const activeLectures = () => state.lectures.filter(l => l.vwr <= state.maxVwr);
      const activeCardsAll = () => state.cards.filter(c => c.vwr <= state.maxVwr);
      const activeNormsAll = () => state.norms.filter(n => n.vwr <= state.maxVwr);
      const activePhrasesAll = () => state.phrases.filter(p => p.vwr <= state.maxVwr);
      const activeDrillsAll = () => state.drills.filter(d => d.vwr <= state.maxVwr);

      function setMaxVwr(val) {
        const next = Math.max(1, Math.min(15, Number(val) || 7));
        if (next === state.maxVwr) return;
        state.maxVwr = next;
        if (state.cardVwrFilter !== 'ALL' && Number(state.cardVwrFilter) > state.maxVwr) {
          state.cardVwrFilter = 'ALL';
        }
        state.cardIdx = 0;
        state.cardFlipped = false;
        saveState();
        renderAll();
      }

      // 5. MODALS: BESTEHENS-TIPPS, BACKUP/IMPORT, CARD CRUD, NORM CRUD
      // =======================================================================

      function openBackupModal() {
        openModal(`
          <div class="modal-head">
            <div>
              <h3 style="font-size:16px;font-weight:700;">Backup, Import &amp; Reset</h3>
              <p class="text-xs text-muted">100 % lokal im Browser (localStorage) · JSON-Sicherung für Gerätewechsel</p>
            </div>
            <button type="button" class="btn btn-icon" id="bk-x">✕</button>
          </div>

          <div class="phrase-block">
            <p class="text-sm fw-bold">1. JSON-Backup exportieren</p>
            <p class="text-xs text-muted">Sichert Lernstand, eigene Karten, Paragrafen, Notizen und Drill-Ergebnisse.</p>
            <div class="wrap-bar">
              <button type="button" class="btn btn-primary btn-sm" id="bk-export">JSON-Backup herunterladen</button>
            </div>
          </div>

          <div class="phrase-block">
            <p class="text-sm fw-bold">2. JSON-Backup importieren</p>
            <p class="text-xs text-muted">Wähle eine exportierte <code>.json</code>-Datei oder füge den JSON-Text direkt ein.</p>
            <div class="wrap-bar">
              <button type="button" class="btn btn-sm" id="bk-pick-file">JSON-Datei wählen</button>
              <input type="file" id="bk-file-input" accept=".json,application/json" style="display:none;" />
            </div>
            <textarea class="textarea" id="bk-json-paste" rows="3" placeholder='Optional: Exportiertes JSON hier einfügen...'></textarea>
            <div class="wrap-bar">
              <button type="button" class="btn btn-sm" id="bk-apply-paste">Eingefügtes JSON laden</button>
            </div>
          </div>

          <div class="divider wrap-between">
            <button type="button" class="btn btn-sm btn-warn" id="bk-reset-progress">Nur Lernstand zurücksetzen</button>
            <button type="button" class="btn btn-sm btn-danger" id="bk-reset-factory">Auf Werkszustand zurücksetzen</button>
          </div>
        `);

        document.getElementById('bk-x').onclick = closeModal;

        document.getElementById('bk-export').onclick = () => {
          const payload = {
            app: 'KlausurFit-VWR-Modul1',
            version: 2,
            exportedAt: new Date().toISOString(),
            maxVwr: state.maxVwr,
            theme: state.theme,
            notes: state.notes,
            cards: state.cards,
            norms: state.norms,
            drillAnswers: state.drillAnswers
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `klausurfit-vwr-stand${state.maxVwr}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('JSON-Backup gespeichert!');
        };

        function handleJsonImport(text) {
          try {
            const obj = JSON.parse(text);
            if (!obj || !Array.isArray(obj.cards)) {
              showToast('Ungültiges Backup-Format.', 'danger');
              return;
            }
            openConfirm(
              'Backup wiederherstellen?',
              `Das Backup enthält ${obj.cards.length} Karten (Stand VWR ${obj.maxVwr || 7}). Dein aktueller Stand wird überschrieben.`,
              'Wiederherstellen',
              false,
              () => {
                state.maxVwr = (typeof obj.maxVwr === 'number' && obj.maxVwr >= 1 && obj.maxVwr <= 15) ? obj.maxVwr : 7;
                if (obj.theme === 'dark' || obj.theme === 'light') state.theme = obj.theme;
                if (obj.notes && typeof obj.notes === 'object') state.notes = obj.notes;
                state.cards = obj.cards;
                if (Array.isArray(obj.norms) && obj.norms.length > 0) state.norms = obj.norms;
                state.drillAnswers = (obj.drillAnswers && typeof obj.drillAnswers === 'object') ? obj.drillAnswers : {};
                state.cardIdx = 0;
                state.cardFlipped = false;
                applyTheme();
                saveState();
                renderAll();
                showToast('Backup erfolgreich geladen!');
              }
            );
          } catch (err) {
            showToast('JSON konnte nicht gelesen werden.', 'danger');
          }
        }

        const fileInput = document.getElementById('bk-file-input');
        document.getElementById('bk-pick-file').onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => handleJsonImport(ev.target.result);
          reader.readAsText(file, 'UTF-8');
        };

        document.getElementById('bk-apply-paste').onclick = () => {
          const val = document.getElementById('bk-json-paste').value.trim();
          if (!val) {
            showToast('Bitte zuerst JSON einfügen.', 'warn');
            return;
          }
          handleJsonImport(val);
        };

        document.getElementById('bk-reset-progress').onclick = () => {
          openConfirm(
            'Lernstand zurücksetzen?',
            'Alle Karten-Bewertungen und Drill-Antworten werden zurückgesetzt. Deine eigenen Karten, Paragrafen und Notizen bleiben erhalten.',
            'Zurücksetzen',
            true,
            () => {
              state.cards.forEach(c => { c.status = 'new'; });
              state.drillAnswers = {};
              saveState();
              renderAll();
              showToast('Lernstand zurückgesetzt.', 'info');
            }
          );
        };

        document.getElementById('bk-reset-factory').onclick = () => {
          openConfirm(
            'Komplett auf Werkszustand zurücksetzen?',
            'Alle eigenen Karten, geänderten Paragrafen, Notizen und dein Lernstand werden gelöscht und durch die Standard-Daten ersetzt.',
            'Werkszustand laden',
            true,
            () => {
              const fresh = defaultPersisted();
              state.maxVwr = fresh.maxVwr;
              state.theme = fresh.theme;
              state.notes = fresh.notes;
              state.cards = fresh.cards;
              state.norms = fresh.norms;
              state.drillAnswers = fresh.drillAnswers;
              state.cardVwrFilter = 'ALL';
              state.cardIdx = 0;
              state.cardFlipped = false;
              applyTheme();
              saveState();
              renderAll();
              showToast('Werkszustand wiederhergestellt.', 'info');
            }
          );
        };
      }

      function openCardModal(card) {
        const isEdit = !!card;
        const defaultVwr = isEdit ? card.vwr : (state.cardVwrFilter !== 'ALL' ? Number(state.cardVwrFilter) : state.maxVwr);
        const defaultTag = isEdit ? card.tag : 'Definition';

        openModal(`
          <form id="card-form" class="stack">
            <div class="modal-head">
              <h3 style="font-size:16px;font-weight:700;">${isEdit ? 'Karteikarte bearbeiten' : 'Neue Karteikarte anlegen'}</h3>
              <button type="button" class="btn btn-icon" id="cf-x">✕</button>
            </div>

            <div class="form-grid-2">
              <div>
                <label class="field-label" for="cf-vwr">Vorlesung (VWR 1–15)</label>
                <select id="cf-vwr" class="select">
                  ${state.lectures.map(l => `<option value="${l.vwr}" ${l.vwr === defaultVwr ? 'selected' : ''}>VWR ${l.vwr}: ${esc(l.title)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="field-label" for="cf-tag">Tag</label>
                <select id="cf-tag" class="select">
                  ${['Definition', 'Schema', 'Falle', 'Frist', 'Aufhebung'].map(t => `<option value="${t}" ${t === defaultTag ? 'selected' : ''}>${t}</option>`).join('')}
                </select>
              </div>
            </div>

            <div>
              <label class="field-label" for="cf-front">Vorderseite (präzise Frage) *</label>
              <input id="cf-front" class="input" type="text" required value="${esc(isEdit ? card.front : '')}" placeholder="z. B. Welche Fehlerfolge hat eine fehlende RBB?" />
            </div>

            <div>
              <label class="field-label" for="cf-back">Rückseite (knappe Klausur-Antwort, **fett** möglich) *</label>
              <textarea id="cf-back" class="textarea" rows="4" required placeholder="Führt **nicht** zur formellen Rechtswidrigkeit, sondern nur zur Jahresfrist (§ 58 II VwGO).">${esc(isEdit ? card.back : '')}</textarea>
            </div>

            <div class="wrap-bar" style="justify-content:flex-end;">
              <button type="button" class="btn" id="cf-cancel">Abbrechen</button>
              <button type="submit" class="btn btn-primary">${isEdit ? 'Speichern' : 'Karte anlegen'}</button>
            </div>
          </form>
        `);

        document.getElementById('cf-x').onclick = closeModal;
        document.getElementById('cf-cancel').onclick = closeModal;
        document.getElementById('card-form').onsubmit = (e) => {
          e.preventDefault();
          const vwr = Math.max(1, Math.min(15, Number(document.getElementById('cf-vwr').value) || 1));
          const tag = document.getElementById('cf-tag').value;
          const front = document.getElementById('cf-front').value.trim();
          const back = document.getElementById('cf-back').value.trim();
          if (!front || !back) return;

          if (isEdit) {
            card.vwr = vwr;
            card.tag = tag;
            card.front = front;
            card.back = back;
            showToast('Karte gespeichert!');
          } else {
            state.cards.push(mkCard('c-' + Date.now().toString(36), vwr, tag, front, back));
            if (vwr > state.maxVwr) state.maxVwr = vwr;
            showToast('Neue Karte erstellt!');
          }
          closeModal();
          saveState();
          renderAll();
        };
      }

      function openNormModal(normObj) {
        const isEdit = !!normObj;
        const defaultVwr = isEdit ? normObj.vwr : state.maxVwr;
        const defaultCat = isEdit ? normObj.cat : 'Formell/Fehler';
        const cats = ['Grundlagen/VA', 'Formell/Fehler', 'Fristen', 'Ermessen/NB', 'Aufhebung §§ 48/49', 'Rechtsschutz/Spezial'];

        openModal(`
          <form id="norm-form" class="stack">
            <div class="modal-head">
              <h3 style="font-size:16px;font-weight:700;">${isEdit ? 'Paragraf bearbeiten' : 'Neuen Paragrafen anlegen'}</h3>
              <button type="button" class="btn btn-icon" id="nf-x">✕</button>
            </div>

            <div class="form-grid-2">
              <div>
                <label class="field-label" for="nf-vwr">Vorlesung (VWR 1–15)</label>
                <select id="nf-vwr" class="select">
                  ${state.lectures.map(l => `<option value="${l.vwr}" ${l.vwr === defaultVwr ? 'selected' : ''}>VWR ${l.vwr}: ${esc(l.title)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="field-label" for="nf-cat">Kategorie</label>

              <label class="field-label" for="nf-meaning">Bedeutung *</label>

            <div>
              <label class="field-label" for="nf-usage">Klausur-Einsatz</label>
              <input id="nf-usage" class="input" type="text" value="${esc(isEdit ? normObj.usage : '')}" placeholder="Wo und wie wird die Norm im Gutachten zitiert?" />
            </div>

            <div class="wrap-bar" style="justify-content:flex-end;">
              <button type="button" class="btn" id="nf-cancel">Abbrechen</button>
              <button type="submit" class="btn btn-primary">${isEdit ? 'Speichern' : 'Paragraf anlegen'}</button>
            </div>
          </form>
        `);

        document.getElementById('nf-x').onclick = closeModal;
        document.getElementById('nf-cancel').onclick = closeModal;
        document.getElementById('norm-form').onsubmit = (e) => {
          e.preventDefault();
