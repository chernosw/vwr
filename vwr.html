          const cat = document.getElementById('nf-cat').value;
          const norm = document.getElementById('nf-norm').value.trim();
          const meaning = document.getElementById('nf-meaning').value.trim();
          const usage = document.getElementById('nf-usage').value.trim();
          if (!norm || !meaning) return;

          if (isEdit) {
            normObj.vwr = vwr;
            normObj.cat = cat;
            normObj.norm = norm;
            normObj.meaning = meaning;
            normObj.usage = usage;
            showToast('Paragraf gespeichert!');
          } else {
            state.norms.push({ id: 'n-' + Date.now().toString(36), vwr, cat, norm, meaning, usage });
            if (vwr > state.maxVwr) state.maxVwr = vwr;
            showToast('Paragraf hinzugefügt!');
          }
          closeModal();
          saveState();
          renderAll();
        };
      }

      // =======================================================================
      // 6. RENDER HEADER CHROME & LEFT VORLESUNGS-GUIDE
      // =======================================================================

      function renderHeaderAndTabs() {
        const cActive = activeCardsAll();
        const nActive = activeNormsAll();
        const pActive = activePhrasesAll();
        const dActive = activeDrillsAll();

        const knownCount = cActive.filter(c => c.status === 'known').length;
        document.getElementById('hdr-mastery').textContent = `${knownCount} / ${cActive.length} sitzen`;
        document.getElementById('hdr-vwr-badge').textContent = `Stand: bis VWR ${state.maxVwr}/15`;
        document.getElementById('vwr-slider').value = String(state.maxVwr);
        document.getElementById('btn-vwr-minus').disabled = state.maxVwr <= 1;
        document.getElementById('btn-vwr-plus').disabled = state.maxVwr >= 15;

        const btnAll = document.getElementById('btn-vwr-all');
        btnAll.className = state.maxVwr === 15 ? 'btn btn-sm btn-primary' : 'btn btn-sm';

        document.getElementById('hdr-scope-counts').textContent =
          `Aktiv: ${cActive.length} Karten · ${nActive.length} Normen · ${pActive.length} Schemata · ${dActive.length} Drills`;

        // Mobile guide button
        const guideEl = document.getElementById('left-guide');
        const mobLbl = document.getElementById('mobile-guide-label');
        const mobArr = document.getElementById('mobile-guide-arrow');
        if (state.mobileGuideOpen) {
          guideEl.classList.remove('mobile-hidden');
          mobLbl.textContent = `Vorlesungs-Guide ausblenden (VWR 1–${state.maxVwr})`;
          mobArr.textContent = '▴';
        } else {
          guideEl.classList.add('mobile-hidden');
          mobLbl.textContent = `Vorlesungs-Guide einblenden (VWR 1–${state.maxVwr})`;
          mobArr.textContent = '▾';
        }

        // Tab counts & active state
        document.getElementById('tc-cards').textContent = String(cActive.length);
        document.getElementById('tc-norms').textContent = String(nActive.length);
        document.getElementById('tc-phrases').textContent = String(pActive.length);
        document.getElementById('tc-drills').textContent = String(dActive.length);

        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === state.activeTab);
        });
      }

      function renderLeftGuide() {
        const box = document.getElementById('left-guide');
        const visible = activeLectures();
        const filtered = state.guideCoreOnly ? visible.filter(l => l.relevance === 'Kernstoff') : visible;

        const listHtml = filtered.map(lec => {
          const isOpen = state.expandedLecId === lec.id;
          const cardCount = state.cards.filter(c => c.vwr === lec.vwr).length;
          const noteVal = state.notes[lec.id] || '';
          const relBadge = lec.relevance === 'Kernstoff'
            ? '<span class="badge badge-accent">Kernstoff</span>'
            : '<span class="badge">Basis</span>';

          return `
            <div class="guide-item">
              <button type="button" class="guide-trigger ${isOpen ? 'open' : ''}" data-lec="${esc(lec.id)}">
                <div class="stack-sm" style="gap:4px;min-width:0;flex:1;">
                  <div class="wrap-bar" style="gap:6px;">
                    <span class="text-xs fw-bold text-accent">VWR ${lec.vwr}</span>
                    ${relBadge}
                    ${noteVal.trim() ? '<span class="badge badge-warn">Notiz</span>' : ''}
                  </div>
                  <div style="font-size:13px;font-weight:600;line-height:1.3;color:var(--text);">${esc(lec.title)}</div>
                </div>
                <span class="text-muted" style="font-size:13px;margin-top:2px;">${isOpen ? '▴' : '▾'}</span>
              </button>

              ${isOpen ? `
                <div class="guide-body">
                  <ul class="bullet-list">
                    ${lec.bullets.map(b => `<li><span class="bullet-dot"></span><span>${fmt(b)}</span></li>`).join('')}
                  </ul>

                  <div>
                    <label class="field-label" for="note-${esc(lec.id)}" style="display:flex;justify-content:space-between;">
                      <span>Eigene Notizen (auto-saved)</span>
                      <span class="text-muted" id="saved-${esc(lec.id)}" style="font-weight:500;"></span>
                    </label>
                    <textarea id="note-${esc(lec.id)}" class="textarea guide-note-input" data-note-lec="${esc(lec.id)}" rows="2" placeholder="Eigene Eselsbrücke oder Dozenten-Hinweis...">${esc(noteVal)}</textarea>
                  </div>

                  <button type="button" class="btn btn-primary btn-sm practice-vwr-btn" data-practice-vwr="${lec.vwr}" style="width:100%;">
                    Karten zu VWR ${lec.vwr} üben (${cardCount}) →
                  </button>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');

        const footerHtml = state.maxVwr < 15 ? `
          <div class="guide-footer">
            <p class="text-xs text-muted"><strong>VWR ${state.maxVwr + 1}–15 ausgeblendet</strong> – erhöhe den Regler oben, sobald du weiter bist.</p>
            <button type="button" class="btn btn-sm" id="btn-unlock-next" style="width:100%;">+ VWR ${state.maxVwr + 1} freischalten</button>
          </div>
        ` : '';

        box.innerHTML = `
          <div class="guide-header">
            <div class="wrap-between">
              <div>
                <h2 style="font-size:14.5px;font-weight:700;">Vorlesungs-Guide</h2>
                <p class="text-xs text-muted">Kompakt ohne Ballast · VWR 1–${state.maxVwr}</p>
              </div>
              <span class="badge">${filtered.length} / ${visible.length}</span>
            </div>
            <div class="wrap-bar">
              <button type="button" class="pill ${!state.guideCoreOnly ? 'active' : ''}" id="guide-all" style="flex:1;justify-content:center;">Alle</button>
              <button type="button" class="pill ${state.guideCoreOnly ? 'active' : ''}" id="guide-core" style="flex:1;justify-content:center;">Nur Kernstoff</button>
            </div>
          </div>

          <div class="guide-list">
            ${listHtml || '<div class="empty-box">Keine Kernstoff-Einheiten in VWR 1–' + state.maxVwr + '.</div>'}
          </div>
          ${footerHtml}
        `;

        document.getElementById('guide-all').onclick = () => { state.guideCoreOnly = false; renderLeftGuide(); };
        document.getElementById('guide-core').onclick = () => { state.guideCoreOnly = true; renderLeftGuide(); };

        const unlockBtn = document.getElementById('btn-unlock-next');
        if (unlockBtn) unlockBtn.onclick = () => setMaxVwr(state.maxVwr + 1);

        box.querySelectorAll('.guide-trigger').forEach(btn => {
          btn.onclick = () => {
            const id = btn.dataset.lec;
            state.expandedLecId = state.expandedLecId === id ? null : id;
            renderLeftGuide();
          };
        });

        box.querySelectorAll('.guide-note-input').forEach(ta => {
          ta.oninput = () => {
            const id = ta.dataset.noteLec;
            state.notes[id] = ta.value;
            saveState();
            const ind = document.getElementById('saved-' + id);
            if (ind) {
              ind.textContent = 'Gespeichert';
              clearTimeout(ta._saveTimer);
              ta._saveTimer = setTimeout(() => { if (ind) ind.textContent = ''; }, 1400);
            }
          };
        });

        box.querySelectorAll('.practice-vwr-btn').forEach(btn => {
          btn.onclick = () => {
            state.cardVwrFilter = Number(btn.dataset.practiceVwr);
            state.cardStatusFilter = 'ALL';
            state.cardSearch = '';
            state.cardMode = 'learn';
            state.cardIdx = 0;
            state.cardFlipped = false;
            state.activeTab = 'cards';
            state.mobileGuideOpen = false;
            renderAll();
          };
        });
      }

      // =======================================================================
      // 7. TAB 1: KARTEIKARTEN
      // =======================================================================

      function getFilteredCards() {
        const q = state.cardSearch.trim().toLowerCase();
        return activeCardsAll().filter(c => {
          if (state.cardVwrFilter !== 'ALL' && c.vwr !== Number(state.cardVwrFilter)) return false;
          if (state.cardStatusFilter === 'OPEN' && c.status !== 'new' && c.status !== 'again') return false;
          if (state.cardStatusFilter === 'unsure' && c.status !== 'unsure') return false;
          if (state.cardStatusFilter === 'known' && c.status !== 'known') return false;
          if (q && !c.front.toLowerCase().includes(q) && !c.back.toLowerCase().includes(q) && !c.tag.toLowerCase().includes(q)) return false;
          return true;
        });
      }

      function statusBadgeHtml(st) {
        if (st === 'known') return '<span class="badge badge-success">Sitzt</span>';
        if (st === 'unsure') return '<span class="badge badge-warn">Unsicher</span>';
        if (st === 'again') return '<span class="badge badge-danger">Nochmal</span>';
        return '<span class="badge">Neu</span>';
      }

      function tagBadgeHtml(tag) {
        if (tag === 'Falle') return '<span class="badge badge-danger">Falle</span>';
        if (tag === 'Schema') return '<span class="badge badge-accent">Schema</span>';
        if (tag === 'Frist') return '<span class="badge badge-warn">Frist</span>';
        if (tag === 'Aufhebung') return '<span class="badge badge-accent">Aufhebung</span>';
        return `<span class="badge">${esc(tag)}</span>`;
      }

      function rateCurrentCard(newStatus) {
        const list = getFilteredCards();
        const card = list[state.cardIdx];
        if (!card) return;
        card.status = newStatus;
        state.cardFlipped = false;
        saveState();

        const nextList = getFilteredCards();
        if (nextList.length === 0) {
          state.cardIdx = 0;
        } else if (state.cardStatusFilter === 'ALL') {
          state.cardIdx = (state.cardIdx + 1) % nextList.length;
        } else if (state.cardIdx >= nextList.length) {
          state.cardIdx = 0;
        }
        renderAll();
      }

      function renderCardsTab() {
        const scopeCards = activeCardsAll();
        const list = getFilteredCards();
        if (state.cardIdx >= list.length) state.cardIdx = Math.max(0, list.length - 1);
        const cur = list[state.cardIdx] || null;
        const pct = list.length ? Math.round(((state.cardIdx + 1) / list.length) * 100) : 0;

        const filterCard = `
          <div class="card-box stack">
            <div class="wrap-between">
              <div>
                <h2 style="font-size:15px;font-weight:700;">Karteikarten (${scopeCards.length} von ${state.cards.length} aktiv · VWR 1–${state.maxVwr})</h2>
                <p class="text-xs text-muted">${list.length} Karten im aktuellen Filter</p>
              </div>
              <div class="wrap-bar">
                <button type="button" class="pill ${state.cardMode === 'learn' ? 'active' : ''}" id="fc-m-learn">Lernmodus</button>
                <button type="button" class="pill ${state.cardMode === 'list' ? 'active' : ''}" id="fc-m-list">Karten-Liste</button>
                <button type="button" class="btn btn-primary btn-sm" id="fc-add">+ Neue Karte</button>
              </div>
            </div>

            <div class="divider wrap-between">
              <div class="wrap-bar">
                ${[
                  ['ALL', 'Alle'],
                  ['OPEN', 'Offen / Nochmal'],
                  ['unsure', 'Unsicher'],
                  ['known', 'Sitzt']
                ].map(([k, lbl]) => `<button type="button" class="pill fc-st-pill ${state.cardStatusFilter === k ? 'active' : ''}" data-st="${k}">${lbl}</button>`).join('')}
              </div>

              <div class="wrap-bar" style="flex:1 1 260px;justify-content:flex-end;">
                <select id="fc-vwr-sel" class="select" style="width:auto;min-width:155px;max-width:220px;padding:6px 10px;font-size:12.5px;">
                  <option value="ALL" ${state.cardVwrFilter === 'ALL' ? 'selected' : ''}>Alle VWR (1–${state.maxVwr})</option>
                  ${activeLectures().map(l => `<option value="${l.vwr}" ${Number(state.cardVwrFilter) === l.vwr ? 'selected' : ''}>VWR ${l.vwr}: ${esc(l.title.slice(0, 24))}${l.title.length > 24 ? '…' : ''}</option>`).join('')}
                </select>
                <input type="search" id="fc-search" class="input" value="${esc(state.cardSearch)}" placeholder="Karten suchen..." style="width:175px;max-width:100%;padding:6px 10px;font-size:12.5px;" />
              </div>
            </div>
          </div>
        `;

        if (state.cardMode === 'list') {
          return `
            ${filterCard}
            <div class="card-box stack-sm">
              ${list.length ? list.map(c => `
                <div class="norm-row">
                  <div class="norm-mid">
                    <div class="wrap-bar" style="gap:6px;margin-bottom:4px;">
                      <span class="badge badge-accent">VWR ${c.vwr}</span>
                      ${tagBadgeHtml(c.tag)}
                      ${statusBadgeHtml(c.status)}
                    </div>
                    <p class="text-sm fw-bold">${esc(c.front)}</p>
                    <p class="text-xs text-sec">${fmt(c.back)}</p>
                  </div>
                  <div class="wrap-bar">
                    <button type="button" class="btn btn-sm fc-edit-id" data-id="${esc(c.id)}">Bearbeiten</button>
                    <button type="button" class="btn btn-sm btn-danger fc-del-id" data-id="${esc(c.id)}">Löschen</button>
                  </div>
                </div>
              `).join('') : '<div class="empty-box">Keine Karten für diese Filterkombination gefunden.</div>'}
            </div>
          `;
        }

        if (!cur) {
          return `
            ${filterCard}
            <div class="card-box empty-box stack" style="align-items:center;">
              <p class="fw-bold" style="color:var(--text);">Keine Karten in diesem Filter</p>
              <p class="text-xs text-muted">Super – entweder sitzen hier schon alle Karten oder der Filter ist sehr eng.</p>
              <button type="button" class="btn btn-primary btn-sm" id="fc-clear-filters">Filter zurücksetzen</button>
            </div>
          `;
        }

        return `
          ${filterCard}
          <div class="stack">
            <div class="stack-sm">
              <div class="wrap-between" style="padding:0 2px;">
                <div class="wrap-bar">
                  <span class="text-xs fw-bold text-sec">Karte ${state.cardIdx + 1} von ${list.length}</span>
                  ${statusBadgeHtml(cur.status)}
                </div>
                <div class="wrap-bar">
                  <button type="button" class="btn btn-sm" id="fc-edit-cur">Bearbeiten</button>
                  <button type="button" class="btn btn-sm btn-danger" id="fc-del-cur">Löschen</button>
                </div>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
            </div>

            <div class="flip-scene" id="fc-flip-stage" role="button" tabindex="0">
              <div class="flip-card ${state.cardFlipped ? 'flipped' : ''}">
                <!-- FRONT -->
                <div class="flip-face">
                  <div class="wrap-between">
                    <div class="wrap-bar" style="gap:6px;">
                      <span class="badge badge-accent">VWR ${cur.vwr}</span>
                      ${tagBadgeHtml(cur.tag)}
                    </div>
                    <span class="text-xs text-muted">Vorderseite</span>
                  </div>
                  <p class="flip-question">${esc(cur.front)}</p>
                  <p class="text-xs text-muted" style="text-align:center;">Tippen oder Leertaste zum Umdrehen</p>
                </div>

                <!-- BACK -->
                <div class="flip-face flip-face-back">
                  <div class="wrap-between" style="border-bottom:1px solid var(--border);padding-bottom:8px;">
                    <span class="text-xs fw-bold text-accent">KLAUSUR-ANTWORT</span>
                    <span class="badge badge-accent">VWR ${cur.vwr}</span>
                  </div>
                  <div class="flip-answer">${fmt(cur.back)}</div>
                  <p class="text-xs text-muted" style="text-align:center;">Bewerten: 1 = Nochmal · 2 = Unsicher · 3 = Sitzt</p>
                </div>
              </div>
            </div>

            ${state.cardFlipped ? `
              <div class="rating-grid">
                <button type="button" class="btn btn-danger fc-rate-btn" data-rate="again" style="min-height:44px;">Nochmal (1)</button>
                <button type="button" class="btn btn-warn fc-rate-btn" data-rate="unsure" style="min-height:44px;">Unsicher (2)</button>
                <button type="button" class="btn btn-success fc-rate-btn" data-rate="known" style="min-height:44px;">Sitzt (3)</button>
              </div>
            ` : `
              <div class="wrap-between">
                <button type="button" class="btn" id="fc-prev">← Zurück</button>
                <button type="button" class="btn btn-primary" id="fc-show-ans" style="flex:1 1 160px;max-width:260px;min-height:42px;">Antwort zeigen</button>
                <button type="button" class="btn" id="fc-next">Weiter →</button>
              </div>
            `}
          </div>
        `;
      }

      // =======================================================================
      // 8. TAB 2: PARAGRAFEN-TRAINER
      // =======================================================================

      function renderNormsTab() {
        const scopeNorms = activeNormsAll();
        const cats = ['ALL', 'Grundlagen/VA', 'Formell/Fehler', 'Fristen', 'Ermessen/NB', 'Aufhebung §§ 48/49', 'Rechtsschutz/Spezial'];
        const q = state.normSearch.trim().toLowerCase();

        const list = scopeNorms.filter(n => {
          if (state.normCatFilter !== 'ALL' && n.cat !== state.normCatFilter) return false;
          if (q && !n.norm.toLowerCase().includes(q) && !n.meaning.toLowerCase().includes(q) && !n.usage.toLowerCase().includes(q)) return false;
          return true;
        });

        return `
          <div class="card-box stack">
            <div class="wrap-between">
              <div>
                <h2 style="font-size:15px;font-weight:700;">Paragrafen-Trainer (${scopeNorms.length} von ${state.norms.length} aktiv · VWR 1–${state.maxVwr})</h2>
                <p class="text-xs text-muted">3-Stufen-Selbsttest: Im Verdeckt-Modus auf einen Eintrag tippen zum Aufdecken</p>
              </div>
              <button type="button" class="btn btn-primary btn-sm" id="nm-add">+ Neuer Paragraf</button>
            </div>

            <div class="divider wrap-between">
              <div class="wrap-bar">
                <button type="button" class="pill nm-quiz-btn ${state.normQuizMode === 'show' ? 'active' : ''}" data-qm="show">Alles zeigen</button>
                <button type="button" class="pill nm-quiz-btn ${state.normQuizMode === 'hideMeaning' ? 'active' : ''}" data-qm="hideMeaning">Bedeutung verdecken</button>
                <button type="button" class="pill nm-quiz-btn ${state.normQuizMode === 'hideNorm' ? 'active' : ''}" data-qm="hideNorm">Norm verdecken</button>
              </div>
              <input type="search" id="nm-search" class="input" value="${esc(state.normSearch)}" placeholder="Norm oder Stichwort..." style="width:210px;max-width:100%;padding:6px 10px;font-size:12.5px;" />
            </div>

            <div class="wrap-bar">
              ${cats.map(c => `<button type="button" class="pill nm-cat-btn ${state.normCatFilter === c ? 'active' : ''}" data-cat="${esc(c)}">${c === 'ALL' ? 'Alle Kategorien' : esc(c)}</button>`).join('')}
            </div>
          </div>

          <div class="stack-sm">
            ${list.length ? list.map(n => {
              const rev = !!state.normRevealed[n.id];
              const hideNorm = state.normQuizMode === 'hideNorm' && !rev;
              const hideMean = state.normQuizMode === 'hideMeaning' && !rev;

              return `
                <div class="norm-row ${state.normQuizMode !== 'show' ? 'clickable' : ''}" data-norm-row="${esc(n.id)}">
                  <div class="norm-left">
                    <div class="wrap-bar" style="gap:6px;">
                      <span class="badge">VWR ${n.vwr}</span>
                      <span class="text-xs text-muted">${esc(n.cat)}</span>
                    </div>
                    ${hideNorm
                      ? '<span class="norm-mask">Tippen: Norm aufdecken</span>'
                      : `<span class="fw-bold text-accent" style="font-size:14.5px;">${esc(n.norm)}</span>`}
                  </div>

                  <div class="norm-mid">
                    ${hideMean
                      ? '<span class="norm-mask">Tippen: Bedeutung &amp; Einsatz aufdecken</span>'
                      : `<p class="text-sm" style="font-weight:600;color:var(--text);">${esc(n.meaning)}</p>
                         <p class="text-xs text-muted"><strong class="text-sec">Klausur:</strong> ${esc(n.usage)}</p>`}
                  </div>

                  <div class="wrap-bar">
                    <button type="button" class="btn btn-sm nm-edit" data-id="${esc(n.id)}">Bearbeiten</button>
                    <button type="button" class="btn btn-sm btn-danger nm-del" data-id="${esc(n.id)}">Löschen</button>
                  </div>
                </div>
              `;
            }).join('') : '<div class="card-box empty-box">Keine Paragrafen für diese Auswahl gefunden.</div>'}
          </div>
        `;
      }

      // =======================================================================
      // 9. TAB 3: FORMULIERUNGSHILFEN & PRÜFUNGSSCHEMATA
      // =======================================================================

      function renderClozeText(raw, prefix) {
        let i = 0;
        return esc(raw).replace(/\{\{(.+?)\}\}/g, (_, inner) => {
          const key = `${prefix}-g${i++}`;
          if (!state.phraseCloze) {
            return `<strong style="color:var(--text);font-weight:700;">${inner}</strong>`;
          }
          const isRev = !!state.phraseGapsRevealed[key];
          return `<span class="cloze-gap ${isRev ? 'revealed' : ''}" data-gap="${key}" title="Tippen zum Aufdecken">${inner}</span>`;
        });
      }

      function renderPhrasesTab() {
        const list = activePhrasesAll();

        return `
          <div class="card-box wrap-between">
            <div>
              <h2 style="font-size:15px;font-weight:700;">Formulierungshilfen &amp; Schemata (${list.length} von ${state.phrases.length} aktiv · VWR 1–${state.maxVwr})</h2>
              <p class="text-xs text-muted">Original-Gutachtentexte aus den HS-Bund-Lösungen · 1-Klick-Kopie &amp; Lücken-Test</p>
            </div>
            <div class="wrap-bar">
              <button type="button" class="btn btn-sm ${state.phraseCloze ? 'btn-primary' : ''}" id="ph-cloze-toggle">
                Lücken-Test: ${state.phraseCloze ? 'AN' : 'AUS'}
              </button>
              ${state.phraseCloze ? '<button type="button" class="btn btn-sm" id="ph-reveal-all">Alle aufdecken</button>' : ''}
            </div>
          </div>

          <div class="stack">
            ${list.length ? list.map(sec => {
              const isOpen = !!state.phraseOpen[sec.id];
              return `
                <article class="card-box" style="padding:0;overflow:hidden;">
                  <button type="button" class="guide-trigger ph-acc ${isOpen ? 'open' : ''}" data-ph="${esc(sec.id)}" style="padding:15px 16px;">
                    <div class="stack-sm" style="gap:4px;min-width:0;flex:1;">
                      <div class="wrap-bar" style="gap:6px;">
                        <span class="badge badge-accent">ab VWR ${sec.vwr}</span>
                        <span style="font-size:14.5px;font-weight:700;color:var(--text);">${esc(sec.title)}</span>
                      </div>
                      <span class="text-xs text-muted">${esc(sec.subtitle)}</span>
                    </div>
                    <span class="text-muted" style="font-size:14px;">${isOpen ? '▴' : '▾'}</span>
                  </button>

                  ${isOpen ? `
                    <div class="stack" style="padding:16px;border-top:1px solid var(--border);">
                      ${sec.tableHtml || ''}
                      ${sec.blocks.map((blk, bIdx) => `
                        <div class="phrase-block">
                          <div class="wrap-between">
                            <span class="text-xs fw-bold text-accent">${esc(blk.label)}</span>
                            <button type="button" class="btn btn-sm ph-copy" data-ph-id="${esc(sec.id)}" data-bidx="${bIdx}">Kopieren</button>
                          </div>
                          <p class="text-sm text-sec" style="line-height:1.62;">${renderClozeText(blk.text, sec.id + '-' + bIdx)}</p>
                        </div>
                      `).join('')}
                      <div class="wrap-bar" style="justify-content:flex-end;">
                        <button type="button" class="btn btn-sm ph-copy-all" data-ph-id="${esc(sec.id)}">Gesamten Baukasten kopieren</button>
                      </div>
                    </div>
                  ` : ''}
                </article>
              `;
            }).join('') : '<div class="card-box empty-box">Erhöhe den Vorlesungsstand auf mindestens VWR 2, um Formulierungshilfen zu sehen.</div>'}
          </div>
        `;
      }

      // =======================================================================
      // 10. TAB 4: KLAUSUR-DRILLS (24 ECHTE HS-BUND-MINI-FÄLLE)
      // =======================================================================

      function renderDrillsTab() {
        const scope = activeDrillsAll();
        const correctCnt = scope.filter(d => state.drillAnswers[d.id] && state.drillAnswers[d.id].correct).length;
        const anyAnswered = scope.some(d => state.drillAnswers[d.id] !== undefined);

        const list = scope.filter(d => {
          const ans = state.drillAnswers[d.id];
          if (state.drillFilter === 'UNSOLVED') return ans === undefined;
          if (state.drillFilter === 'WRONG') return ans !== undefined && !ans.correct;
          return true;
        });

        return `
          <div class="card-box stack">
            <div class="wrap-between">
              <div>
                <h2 style="font-size:15px;font-weight:700;">Klausur-Drills (${scope.length} von ${state.drills.length} aktiv · VWR 1–${state.maxVwr})</h2>
                <p class="text-xs text-muted">Fortschritt im aktuellen Stand: <strong style="color:var(--text);">${correctCnt} / ${scope.length} richtig</strong></p>
              </div>
              ${anyAnswered ? '<button type="button" class="btn btn-sm" id="dr-reset">Drills zurücksetzen</button>' : ''}
            </div>

            <div class="divider wrap-bar">
              <button type="button" class="pill dr-f-btn ${state.drillFilter === 'ALL' ? 'active' : ''}" data-df="ALL">Alle (${scope.length})</button>
              <button type="button" class="pill dr-f-btn ${state.drillFilter === 'UNSOLVED' ? 'active' : ''}" data-df="UNSOLVED">Unbeantwortet</button>
              <button type="button" class="pill dr-f-btn ${state.drillFilter === 'WRONG' ? 'active' : ''}" data-df="WRONG">Falsch beantwortet</button>
            </div>
          </div>

          <div class="stack">
            ${list.length ? list.map((d, idx) => {
              const ans = state.drillAnswers[d.id];
              const done = ans !== undefined;

              return `
                <article class="card-box stack">
                  <div class="wrap-between">
                    <div class="wrap-bar" style="gap:6px;">
                      <span class="badge badge-accent">VWR ${d.vwr}</span>
                      <span class="badge">${esc(d.tag)}</span>
                      <span class="text-xs fw-bold text-muted">${esc(d.title)}</span>
                    </div>
                    ${done ? (ans.correct
                      ? '<span class="badge badge-success">✓ Richtig</span>'
                      : '<span class="badge badge-danger">✕ Falsch</span>') : ''}
                  </div>

                  <p class="text-sm fw-bold" style="line-height:1.5;color:var(--text);">${idx + 1}. ${esc(d.caseText)}</p>

                  <div class="stack-sm">
                    ${d.options.map((opt, oi) => {
                      let cls = 'drill-opt';
                      if (done) {
                        if (oi === d.correct) cls += ' opt-correct';
                        else if (oi === ans.selected) cls += ' opt-wrong';
                        else cls += ' opt-dim';
                      }
                      return `
                        <button type="button" class="${cls}" data-did="${esc(d.id)}" data-oi="${oi}">
                          <span class="opt-letter">${String.fromCharCode(65 + oi)}</span>
                          <span>${esc(opt)}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>

                  ${done ? `
                    <div class="phrase-block" style="background-color:${ans.correct ? 'var(--success-bg)' : 'var(--warn-bg)'};border-color:${ans.correct ? 'var(--success-border)' : 'var(--warn-border)'};">
                      <p class="text-xs" style="color:${ans.correct ? 'var(--success-text)' : 'var(--warn-text)'};line-height:1.55;">
                        <strong>Begründung:</strong> ${esc(d.explain)}
                      </p>
                    </div>
                  ` : ''}
                </article>
              `;
            }).join('') : `
              <div class="card-box empty-box stack" style="align-items:center;">
                <p class="fw-bold" style="color:var(--text);">Keine Drills in dieser Ansicht</p>
                <button type="button" class="btn btn-primary btn-sm" id="dr-show-all">Alle aktiven Drills zeigen</button>
              </div>
            `}
          </div>
        `;
      }

      // =======================================================================
      // 11. TAB EVENT BINDING & MASTER RENDER
      // =======================================================================

      function bindStageEvents() {
        const stage = document.getElementById('tab-stage');

        // --- TAB 1 EVENTS ---
        if (state.activeTab === 'cards') {
          document.getElementById('fc-m-learn').onclick = () => { state.cardMode = 'learn'; renderAll(); };
          document.getElementById('fc-m-list').onclick = () => { state.cardMode = 'list'; renderAll(); };
          document.getElementById('fc-add').onclick = () => openCardModal(null);

          stage.querySelectorAll('.fc-st-pill').forEach(btn => {
            btn.onclick = () => {
              state.cardStatusFilter = btn.dataset.st;
              state.cardIdx = 0;
              state.cardFlipped = false;
              renderAll();
            };
          });

          const sel = document.getElementById('fc-vwr-sel');
          sel.onchange = () => {
            state.cardVwrFilter = sel.value === 'ALL' ? 'ALL' : Number(sel.value);
            state.cardIdx = 0;
            state.cardFlipped = false;
            renderAll();
          };

          const search = document.getElementById('fc-search');
          search.oninput = () => {
            const pos = search.selectionStart;
            state.cardSearch = search.value;
            state.cardIdx = 0;
            state.cardFlipped = false;
            renderAll();
            const nextEl = document.getElementById('fc-search');
            if (nextEl) { nextEl.focus(); nextEl.setSelectionRange(pos, pos); }
          };

          const clearBtn = document.getElementById('fc-clear-filters');
          if (clearBtn) clearBtn.onclick = () => {
            state.cardStatusFilter = 'ALL';
            state.cardVwrFilter = 'ALL';
            state.cardSearch = '';
            state.cardIdx = 0;
            state.cardFlipped = false;
            renderAll();
          };

          // Learn mode controls
          const flipStage = document.getElementById('fc-flip-stage');
          if (flipStage) flipStage.onclick = () => { state.cardFlipped = !state.cardFlipped; renderAll(); };

          const showAns = document.getElementById('fc-show-ans');
          if (showAns) showAns.onclick = () => { state.cardFlipped = true; renderAll(); };

          const prev = document.getElementById('fc-prev');
          if (prev) prev.onclick = () => {
            const len = getFilteredCards().length;
            if (len) { state.cardIdx = (state.cardIdx - 1 + len) % len; state.cardFlipped = false; renderAll(); }
          };

          const next = document.getElementById('fc-next');
          if (next) next.onclick = () => {
            const len = getFilteredCards().length;
            if (len) { state.cardIdx = (state.cardIdx + 1) % len; state.cardFlipped = false; renderAll(); }
          };

          stage.querySelectorAll('.fc-rate-btn').forEach(btn => {
            btn.onclick = () => rateCurrentCard(btn.dataset.rate);
          });

          const editCur = document.getElementById('fc-edit-cur');
          if (editCur) editCur.onclick = () => {
            const card = getFilteredCards()[state.cardIdx];
            if (card) openCardModal(card);
          };

          const delCur = document.getElementById('fc-del-cur');
          if (delCur) delCur.onclick = () => {
            const card = getFilteredCards()[state.cardIdx];
            if (!card) return;
            openConfirm('Karteikarte löschen?', `Möchtest du „${card.front}“ dauerhaft löschen?`, 'Löschen', true, () => {
              state.cards = state.cards.filter(c => c.id !== card.id);
              state.cardFlipped = false;
              saveState();
              renderAll();
              showToast('Karte gelöscht.', 'info');
            });
          };

          // List mode edit/delete
          stage.querySelectorAll('.fc-edit-id').forEach(btn => {
            btn.onclick = () => {
              const card = state.cards.find(c => c.id === btn.dataset.id);
              if (card) openCardModal(card);
            };
          });

          stage.querySelectorAll('.fc-del-id').forEach(btn => {
            btn.onclick = () => {
              const card = state.cards.find(c => c.id === btn.dataset.id);
              if (!card) return;
              openConfirm('Karteikarte löschen?', `Möchtest du „${card.front}“ dauerhaft löschen?`, 'Löschen', true, () => {
                state.cards = state.cards.filter(c => c.id !== card.id);
                saveState();
                renderAll();
                showToast('Karte gelöscht.', 'info');
              });
            };
          });
        }

        // --- TAB 2 EVENTS ---
        if (state.activeTab === 'norms') {
          document.getElementById('nm-add').onclick = () => openNormModal(null);

          stage.querySelectorAll('.nm-quiz-btn').forEach(btn => {
            btn.onclick = () => {
              state.normQuizMode = btn.dataset.qm;
              state.normRevealed = {};
              renderAll();
            };
          });

          stage.querySelectorAll('.nm-cat-btn').forEach(btn => {
            btn.onclick = () => {
              state.normCatFilter = btn.dataset.cat;
              renderAll();
            };
          });

          const nSearch = document.getElementById('nm-search');
          nSearch.oninput = () => {
            const pos = nSearch.selectionStart;
            state.normSearch = nSearch.value;
            renderAll();
            const nextEl = document.getElementById('nm-search');
            if (nextEl) { nextEl.focus(); nextEl.setSelectionRange(pos, pos); }
          };

          stage.querySelectorAll('[data-norm-row]').forEach(row => {
            row.onclick = (e) => {
              if (e.target.closest('button') || state.normQuizMode === 'show') return;
              const id = row.dataset.normRow;
              state.normRevealed[id] = !state.normRevealed[id];
              renderAll();
            };
          });

          stage.querySelectorAll('.nm-edit').forEach(btn => {
            btn.onclick = (e) => {
              e.stopPropagation();
              const obj = state.norms.find(n => n.id === btn.dataset.id);
              if (obj) openNormModal(obj);
            };
          });

          stage.querySelectorAll('.nm-del').forEach(btn => {
            btn.onclick = (e) => {
              e.stopPropagation();
              const obj = state.norms.find(n => n.id === btn.dataset.id);
              if (!obj) return;
              openConfirm('Paragraf löschen?', `Möchtest du „${obj.norm}“ entfernen?`, 'Löschen', true, () => {
                state.norms = state.norms.filter(n => n.id !== obj.id);
                saveState();
                renderAll();
                showToast('Paragraf gelöscht.', 'info');
              });
            };
          });
        }

        // --- TAB 3 EVENTS ---
        if (state.activeTab === 'phrases') {
          document.getElementById('ph-cloze-toggle').onclick = () => {
            state.phraseCloze = !state.phraseCloze;
            state.phraseGapsRevealed = {};
            renderAll();
          };

          const revAll = document.getElementById('ph-reveal-all');
          if (revAll) revAll.onclick = () => {
            stage.querySelectorAll('.cloze-gap').forEach(el => {
              state.phraseGapsRevealed[el.dataset.gap] = true;
            });
            renderAll();
          };

          stage.querySelectorAll('.ph-acc').forEach(btn => {
            btn.onclick = () => {
              const id = btn.dataset.ph;
              state.phraseOpen[id] = !state.phraseOpen[id];
              renderAll();
            };
          });

          stage.querySelectorAll('.cloze-gap').forEach(el => {
            el.onclick = () => {
              const k = el.dataset.gap;
              state.phraseGapsRevealed[k] = !state.phraseGapsRevealed[k];
              renderAll();
            };
          });

          stage.querySelectorAll('.ph-copy').forEach(btn => {
            btn.onclick = () => {
              const sec = state.phrases.find(s => s.id === btn.dataset.phId);
              const blk = sec && sec.blocks[Number(btn.dataset.bidx)];
              if (blk) copyCleanText(blk.text);
            };
          });

          stage.querySelectorAll('.ph-copy-all').forEach(btn => {
            btn.onclick = () => {
              const sec = state.phrases.find(s => s.id === btn.dataset.phId);
              if (!sec) return;
              const combined = sec.blocks.map(b => `${b.label}:\n${b.text}`).join('\n\n');
              copyCleanText(combined);
            };
          });
        }

        // --- TAB 4 EVENTS ---
        if (state.activeTab === 'drills') {
          stage.querySelectorAll('.dr-f-btn').forEach(btn => {
            btn.onclick = () => { state.drillFilter = btn.dataset.df; renderAll(); };
          });

          const showAll = document.getElementById('dr-show-all');
          if (showAll) showAll.onclick = () => { state.drillFilter = 'ALL'; renderAll(); };

          const resetBtn = document.getElementById('dr-reset');
          if (resetBtn) resetBtn.onclick = () => {
            activeDrillsAll().forEach(d => delete state.drillAnswers[d.id]);
            saveState();
            renderAll();
            showToast('Aktive Drills zurückgesetzt.', 'info');
          };

          stage.querySelectorAll('.drill-opt').forEach(btn => {
            btn.onclick = () => {
              const did = btn.dataset.did;
              const oi = Number(btn.dataset.oi);
              const drill = state.drills.find(x => x.id === did);
              if (!drill) return;
              state.drillAnswers[did] = { selected: oi, correct: oi === drill.correct };
              saveState();
              renderAll();
            };
          });
        }
      }

      function renderAll() {
        renderHeaderAndTabs();
        renderLeftGuide();
        const stage = document.getElementById('tab-stage');
        if (state.activeTab === 'cards') stage.innerHTML = renderCardsTab();
        else if (state.activeTab === 'norms') stage.innerHTML = renderNormsTab();
        else if (state.activeTab === 'phrases') stage.innerHTML = renderPhrasesTab();
        else if (state.activeTab === 'drills') stage.innerHTML = renderDrillsTab();
        bindStageEvents();
      }

      // =======================================================================
      // 12. STATIC GLOBAL EVENT LISTENERS & KEYBOARD SHORTCUTS
      // =======================================================================

      document.getElementById('vwr-slider').addEventListener('input', (e) => setMaxVwr(e.target.value));
      document.getElementById('btn-vwr-minus').addEventListener('click', () => setMaxVwr(state.maxVwr - 1));
      document.getElementById('btn-vwr-plus').addEventListener('click', () => setMaxVwr(state.maxVwr + 1));
      document.getElementById('btn-vwr-all').addEventListener('click', () => setMaxVwr(15));

      document.getElementById('btn-theme').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        saveState();
      });

      document.getElementById('btn-tips').addEventListener('click', openTipsModal);
      document.getElementById('btn-backup').addEventListener('click', openBackupModal);

      document.getElementById('btn-mobile-guide').addEventListener('click', () => {
        state.mobileGuideOpen = !state.mobileGuideOpen;
        renderHeaderAndTabs();
      });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeTab = btn.dataset.tab;
          renderAll();
        });
      });

      document.getElementById('modal-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'modal-backdrop') closeModal();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.getElementById('modal-backdrop').classList.contains('open')) {
          closeModal();
          return;
        }
        if (state.activeTab !== 'cards' || state.cardMode !== 'learn') return;
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
        if (document.getElementById('modal-backdrop').classList.contains('open')) return;

        const list = getFilteredCards();
        if (!list.length) return;

        if (e.code === 'Space') {
          e.preventDefault();
          state.cardFlipped = !state.cardFlipped;
          renderAll();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          state.cardIdx = (state.cardIdx + 1) % list.length;
          state.cardFlipped = false;
          renderAll();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          state.cardIdx = (state.cardIdx - 1 + list.length) % list.length;
          state.cardFlipped = false;
          renderAll();
        } else if (state.cardFlipped && e.key === '1') {
          e.preventDefault();
          rateCurrentCard('again');
        } else if (state.cardFlipped && e.key === '2') {
          e.preventDefault();
          rateCurrentCard('unsure');
        } else if (state.cardFlipped && e.key === '3') {
          e.preventDefault();
          rateCurrentCard('known');
        }
      });

      // Boot
      applyTheme();
      renderAll();
    })();
  </script>
</body>
</html>
